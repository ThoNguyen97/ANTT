<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Luyện thi An ninh thông tin</title>
<style>
  :root{--navy:#0d3b66;--bg:#f6f7f9;--card:#fff;--line:#e2e6ea;--txt:#1a2330;--muted:#6b7785;--info:#185fa5;--infobg:#e6f1fb;--ok:#1d7a4d;--okbg:#eaf3e4;--bad:#a32d2d;--badbg:#fcebeb}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--txt);line-height:1.5}
  .wrap{max-width:720px;margin:0 auto;padding:16px}
  header{text-align:center;padding:18px 0 8px}
  header h1{font-size:22px;margin:0 0 4px;color:var(--navy)}
  header p{margin:0;color:var(--muted);font-size:14px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;margin:12px 0}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin:14px 0}
  .pick{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px;cursor:pointer;text-align:center;transition:.15s}
  .pick:hover{border-color:var(--info);background:var(--infobg)}
  .pick b{font-size:15px}.pick span{color:var(--muted);font-size:13px;display:block;margin-top:4px}
  .opt{display:flex;gap:10px;align-items:flex-start;padding:11px 13px;border:1px solid var(--line);border-radius:9px;margin:7px 0;cursor:pointer}
  .opt:hover{background:var(--bg)}
  .opt.sel{border-color:var(--info);background:var(--infobg)}
  .opt.correct{border-color:var(--ok);background:var(--okbg)}
  .opt.wrong{border-color:var(--bad);background:var(--badbg)}
  .let{font-weight:600;min-width:18px}
  .btn{background:#fff;border:1px solid #c7ced6;border-radius:9px;padding:9px 17px;cursor:pointer;font:inherit;font-size:14px;color:var(--txt)}
  .btn:hover{background:var(--bg)}.btn:active{transform:scale(.98)}.btn:disabled{opacity:.45;cursor:default}
  .btn.pri{border-color:var(--info);background:var(--info);color:#fff}
  .btn.pri:hover{background:#13508c}
  .nav{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0}
  .dot{width:32px;height:32px;border-radius:8px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:12px;cursor:pointer;background:#fff}
  .dot.done{background:var(--infobg);color:var(--info);border-color:var(--info)}
  .dot.cur{border:2px solid var(--info)}
  .bar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
  .timer{font-variant-numeric:tabular-nums;font-weight:600;font-size:15px;padding:5px 12px;border-radius:8px;background:var(--bg)}
  .timer.warn{background:var(--badbg);color:var(--bad)}
  .metric{background:var(--bg);border-radius:9px;padding:14px;text-align:center}
  .metric .l{font-size:13px;color:var(--muted)}.metric .v{font-size:26px;font-weight:600;margin-top:4px}
  .lbrow{display:flex;align-items:center;gap:10px;padding:9px 4px;border-bottom:1px solid var(--line);font-size:14px}
  .rank{width:26px;font-weight:600;color:var(--muted)}
  input{height:38px;border:1px solid #c7ced6;border-radius:9px;padding:0 11px;font:inherit;font-size:14px;width:100%}
  .muted{color:var(--muted);font-size:13px}
  .h{font-size:18px;font-weight:600;margin:0 0 6px}
  .row{display:flex;gap:8px;flex-wrap:wrap}
  .warn-box{background:#fff7e6;border:1px solid #ffd98a;border-radius:9px;padding:10px 13px;font-size:13px;color:#7a5300;margin:10px 0}
  footer{text-align:center;color:var(--muted);font-size:12px;padding:20px 0}
  a{color:var(--info)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Luyện thi — Nhập môn Đảm bảo & An ninh thông tin</h1>
    <p>10 bộ đề · 40 câu/đề · 75 phút · tự chấm điểm · bảng xếp hạng chung</p>
  </header>
  <div id="app"></div>
  <footer>Ôn thi ANTT · chia sẻ link cho cả lớp cùng luyện</footer>
</div>

<script type="module">
  // === DÁN CẤU HÌNH FIREBASE CỦA BẠN VÀO ĐÂY (xem README) ===
  const firebaseConfig = {
    apiKey: "PASTE_API_KEY",
    authDomain: "PASTE.firebaseapp.com",
    projectId: "PASTE_PROJECT_ID",
    storageBucket: "PASTE.appspot.com",
    messagingSenderId: "PASTE",
    appId: "PASTE"
  };
  // ==========================================================
  let db=null, fns=null;
  const enabled = firebaseConfig.projectId && firebaseConfig.projectId!=="PASTE_PROJECT_ID";
  if(enabled){
    try{
      const {initializeApp}=await import("https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js");
      const m=await import("https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js");
      const app=initializeApp(firebaseConfig);
      db=m.getFirestore(app);
      fns={collection:m.collection,addDoc:m.addDoc,getDocs:m.getDocs,query:m.query,orderBy:m.orderBy,limit:m.limit};
    }catch(e){console.warn("Firebase init lỗi:",e);}
  }
  window.LB={
    enabled: !!db,
    async save(rec){ if(!db) return false; await fns.addDoc(fns.collection(db,"scores"),rec); return true; },
    async load(){ if(!db) return null; const qy=fns.query(fns.collection(db,"scores"),fns.orderBy("score","desc"),fns.limit(300)); const snap=await fns.getDocs(qy); const out=[]; snap.forEach(d=>out.push(d.data())); return out; }
  };
  window.dispatchEvent(new Event("lb-ready"));
</script>

// Blueprint per exam (sums to 40)
const BLUEPRINT={B1:7,"2A":8,"2B":6,B3:5,B4:5,B5:6,B6:3};
// group bank by topic
const POOL={}; BANK.forEach(q=>{(POOL[q.t]=POOL[q.t]||[]).push(q);});
// seeded PRNG (mulberry32)
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function shuffle(arr,rand){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(rand()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
// build exam N (1..10) deterministically
function buildExam(n){
  const rand=rng(n*7919+13);
  const out=[];
  for(const t in BLUEPRINT){
    const need=BLUEPRINT[t]; const pool=POOL[t]||[];
    const sh=shuffle(pool,rand);
    // take 'need', cycling if pool smaller
    for(let i=0;i<need;i++) out.push(sh[i%sh.length]);
  }
  // shuffle question order within exam, and shuffle options per question
  const qorder=shuffle(out,rand);
  return qorder.map(q=>{
    const idxs=shuffle([0,1,2,3],rand);
    const o=idxs.map(i=>q.o[i]);
    const a=idxs.indexOf(q.a);
    return {q:q.q,o,a};
  });
}

function start(n){S.exam=n;S.idx=0;S.ans=new Array(EXAMS[n].length).fill(-1);S.left=DUR;

  const f=$('<div class="row" style="margin-bottom:12px"></div>');
  const mk=(lb,v)=>{const b=$('<button class="btn'+(filter===v?' pri':'')+'">'+lb+'</button>');b.onclick=()=>showLB(v);return b;};
  f.appendChild(mk("Tất cả",null));for(let n=1;n<=NUM_EXAMS;n++)f.appendChild(mk("Đề "+n,n));
  app.appendChild(f);
  const ld=$('<p class="muted">Đang tải…</p>');app.appendChild(ld);
  let data=null;try{if(window.LB&&window.LB.enabled)data=await window.LB.load();}catch(e){}
  if(!data)data=JSON.parse(localStorage.getItem("antt_lb")||"[]");
  ld.remove();
  if(!window.LB||!window.LB.enabled)app.appendChild($('<div class="warn-box">Đang hiển thị điểm lưu cục bộ (chưa kết nối Firebase).</div>'));
  let lb=data.slice();if(filter)lb=lb.filter(x=>x.exam===filter);
  lb.sort((a,b)=>b.score-a.score||a.used-b.used);
  if(!lb.length){app.appendChild($('<div class="card"><p class="muted" style="margin:0">Chưa có ai nộp bài. Hãy là người đầu tiên!</p></div>'));}
  else{const card=$('<div class="card"></div>');
    card.appendChild($('<div class="lbrow" style="font-weight:600;color:var(--muted)"><span class="rank">#</span><span style="flex:1">Tên</span><span style="width:54px">Đề</span><span style="width:54px;text-align:right">Điểm</span><span style="width:60px;text-align:right">T.gian</span></div>'));
    lb.slice(0,100).forEach((x,i)=>{const r=$('<div class="lbrow"></div>');r.innerHTML='<span class="rank">'+(i+1)+'</span><span style="flex:1">'+esc(x.name)+'</span><span style="width:54px" class="muted">Đề '+x.exam+'</span><span style="width:54px;text-align:right;font-weight:600">'+Number(x.score).toFixed(2)+'</span><span style="width:60px;text-align:right" class="muted">'+fmt(x.used)+'</span>';card.appendChild(r);});
    app.appendChild(card);}
  const b=$('<button class="btn" style="margin-top:12px">← Về trang chính</button>');b.onclick=home;app.appendChild(b);
}
home();
</script>
</body>
</html>
